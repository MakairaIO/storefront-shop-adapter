name: Publish NPM Packages

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Get list of packages
        id: get-packages
        run: echo "PACKAGES=$(ls -d packages/* | jq -R -s -c 'split(\"\\n\")[:-1]')" >> $GITHUB_ENV

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in $(echo $PACKAGES | jq -r '.[]'); do
            PACKAGE_NAME=$(node -p "require('./$package/package.json').name")
            PACKAGE_VERSION=$(node -p "require('./$package/package.json').version")

            echo "Checking $PACKAGE_NAME@$PACKAGE_VERSION..."
            
            if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" > /dev/null 2>&1; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published. Skipping..."
            else
              echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION..."
              npm publish --workspace "$package"
            fi
          done
