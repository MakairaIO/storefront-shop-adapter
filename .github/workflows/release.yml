name: Release a new version
on:
  push:
    branches:
      - stable

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    if: |
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]')) &&
      !(github.event_name == 'pull_request' && contains(join(github.event.pull_request.title, github.event.pull_request.body), '[skip ci]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          git_user_signingkey: true
          git_commit_gpgsign: true
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1 or later for trusted publishing
      - run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Semantic release storefront-types
        run: ./node_modules/.bin/turbo run release --filter=@makaira/storefront-types
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_USERNAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_USERNAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_EMAIL }}

      # - name: Run renovate
      #   uses: renovatebot/github-action@v41.0.14
      #   with:
      #     configurationFile: ./renovate.config.js
      #     token: ${{ secrets.RENOVATE_TOKEN }}
      #     gitAuthor: ${{ secrets.GIT_AUTHOR }}
      #   env:
      #     GIT_AUTHOR: ${{ secrets.GIT_AUTHOR }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     LOG_LEVEL: debug

      - name: Fetch latest version
        run: |
          git restore .
          git pull

      - name: Install dependencies
        run: npm ci

      - name: Semantic release
        run: ./node_modules/.bin/turbo run release --filter="!@makaira/storefront-types" --concurrency=1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_USERNAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_USERNAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_EMAIL }}
